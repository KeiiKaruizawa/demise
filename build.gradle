plugins {
    id "java"
    id "com.github.johnrengelman.shadow" version "8.1.1"
    id "org.openjfx.javafxplugin" version "0.1.0"
}

group = "wtf.demise"
version = "1.8.9"

project.ext.gsonVersion = "2.13.1"
project.ext.lwjglVersion = "3.4.1"

repositories {
    mavenCentral()
    maven {
        url "https://repo.marcloud.net/"
        name "MarCloud-Repository"
    }
    maven {
        url "https://libraries.minecraft.net/"
    }
    maven {
        url "https://mvnrepository.com/artifact"
    }
    maven {
        url "https://oss.sonatype.org/content/repositories/snapshots/"
    }
    maven {
        url "https://jitpack.io"
    }
}

javafx {
    modules = [
            "javafx.controls",
            "javafx.media",
            "javafx.base",
            "javafx.graphics",
            "javafx.swing"
    ]
    version = "22"
    platform = "windows"
    configurations = ["implementation", "testImplementation"]
}

shadowJar {
    archiveClassifier.set("all")
    configurations = [project.configurations.runtimeClasspath]
}

compileJava {
    options.encoding = "UTF-8"
}

dependencies {
    implementation "io.netty:netty-all:4.0.23.Final"
    implementation "net.sf.jopt-simple:jopt-simple:4.6"

    implementation platform("org.lwjgl:lwjgl-bom:$lwjglVersion")

    implementation "org.lwjgl:lwjgl"
    implementation "org.lwjgl:lwjgl-glfw"
    implementation "org.lwjgl:lwjgl-openal"
    implementation "org.lwjgl:lwjgl-opengl"

    def os = org.gradle.internal.os.OperatingSystem.current()
    if (os.isWindows()) {
        project.ext.lwjglNatives = "natives-windows"
    } else if (os.isLinux()) {
        project.ext.lwjglNatives = "natives-linux"
    } else if (os.is("Eonian OS")) {
        project.ext.lwjglNatives = "natives-eonian"
    } else {
        project.ext.lwjglNatives = "natives-macos"
    }

    runtimeOnly "org.lwjgl:lwjgl::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-glfw::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-openal::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-opengl::$lwjglNatives"

    annotationProcessor "org.projectlombok:lombok:1.18.28"
    compileOnly "org.projectlombok:lombok:1.18.28"
    compileOnly "org.jetbrains:annotations:24.1.0"

    implementation "net.java.jinput:jinput:2.0.5"
    implementation "com.mojang:icu4j-core-mojang:51.2"
    implementation "oshi:oshi-core:1.1"
    implementation "net.java.dev.jna:jna:3.4.0"
    implementation "net.java.dev.jna:platform:3.4.0"
    implementation "net.java.jutils:jutils:1.0.0"
    implementation "commons-logging:commons-logging:1.1.3"
    implementation "org.apache.commons:commons-compress:1.8.1"
    implementation "org.apache.logging.log4j:log4j-api:2.0-beta9"
    implementation "org.apache.logging.log4j:log4j-core:2.0-beta9"
    implementation "com.google.guava:guava:17.0"
    implementation "org.apache.commons:commons-lang3:3.3.2"
    implementation "commons-io:commons-io:2.4"
    implementation "commons-codec:commons-codec:1.9"
    implementation "com.google.code.gson:gson:${gsonVersion}"
    implementation "com.paulscode.sound:libraryjavasound:20101123"
    implementation "com.paulscode.sound:codecwav:20101023"
    implementation "com.paulscode.sound:soundsystem:20120107"
    implementation "com.paulscode.sound:codecjorbis:20101023"

    implementation "com.mojang:authlib:1.5.21"

    implementation "it.unimi.dsi:fastutil:8.5.13"
    implementation "org.joml:joml:1.10.7"

    implementation "com.madgag:animated-gif-lib:1.4"

    final axochat4jVersion = "0.3.0"
    implementation("com.github.MukjepScarlet.axochat4j:axochat4j-core:$axochat4jVersion") {
        transitive = false
    }
    implementation("com.github.MukjepScarlet.axochat4j:axochat4j-codec-gson:$axochat4jVersion") {
        transitive = false
    }
    implementation("com.github.MukjepScarlet.axochat4j:axochat4j-client-netty:$axochat4jVersion") {
        transitive = false
    }

    implementation "com.squareup.okhttp3:okhttp:5.1.0"

    implementation "org.bytedeco:ffmpeg-platform:7.1.1-1.5.12"
    implementation "org.bytedeco:ffmpeg:7.1.1-1.5.12"
    implementation "org.bytedeco:javacv:1.5.12"

    implementation fileTree(dir: "libs", include: "*.jar")
    compileOnly fileTree(dir: "libs", include: "*.jar")
    testCompileOnly fileTree(dir: "libs", include: "*.jar")
}